name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint OpenAPI contract
        run: yarn lint:api

      - name: Check generated API types match openapi.yaml
        run: |
          yarn generate:api
          git diff --exit-code -- src/adapters/in/http/generated

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Architecture rules
        run: yarn arch

      - name: Tests with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: typescript/coverage/
          retention-days: 14

  image-scan:
    name: Scan Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build -t time-deposit-api:ci typescript

      # Trivy CLI from its official image, pinned by digest (no third-party action code runs here).
      # Fails on CRITICAL/HIGH vulnerabilities that have a fix, so CD never publishes them.
      - name: Scan image with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 time-deposit-api:ci
