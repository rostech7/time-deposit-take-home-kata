name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint OpenAPI contract
        run: yarn lint:api

      - name: Check generated API types match openapi.yaml
        run: |
          yarn generate:api
          git diff --exit-code -- src/adapters/in/http/generated

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Architecture rules
        run: yarn arch

      - name: Tests with coverage
        run: yarn test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: typescript/coverage/
          retention-days: 14
