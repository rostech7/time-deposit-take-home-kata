# Git hooks (https://lefthook.dev). Installed automatically by `yarn install` in typescript/.
pre-commit:
  parallel: true
  commands:
    lint:
      root: typescript/
      glob: '*.{ts,js,json}'
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      root: typescript/
      glob: '*.ts'
      run: npm run -s typecheck
