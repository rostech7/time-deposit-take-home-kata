# How to run:
#   docker compose up -d --wait                          PostgreSQL only (then `yarn start` on your machine)
#   docker compose --profile full up -d --wait           PostgreSQL + API image published to GHCR
#   docker compose --profile local up -d --wait --build  PostgreSQL + API built from this working copy
# Stop and remove data: docker compose --profile full --profile local down -v

x-api: &api
  environment:
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/time_deposits
    SEED_DATABASE: 'true'
  ports:
    - '${API_PORT:-3000}:3000'
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_deposits
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d time_deposits']
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    <<: *api
    profiles: [full]
    image: ghcr.io/rostech7/time-deposit-take-home-kata:latest
    platform: linux/amd64

  api-local:
    <<: *api
    profiles: [local]
    build: .
